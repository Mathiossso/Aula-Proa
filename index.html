<!-- Carrega a biblioteca do Supabase -->
<script src="https://jsdelivr.net"></script>

<script>
  // Substitua com as credenciais que aparecem nas configurações do seu projeto Supabase (Project Settings > API)
  const SUPABASE_URL = "SUA_SUPABASE_URL_AQUI";
  const SUPABASE_ANON_KEY = "SUA_SUPABASE_ANON_KEY_AQUI";

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Escuta o envio do formulário
  document.getElementById('meuFormulario').addEventListener('submit', async (e) => {
    e.preventDefault(); // Impede a página de recarregar

    // Pega os valores digitados
    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const mensagem = document.getElementById('mensagem').value;

    // Envia para a tabela 'mensagens' do Supabase
    const { data, error } = await supabase
      .from('mensagens')
      .insert([{ nome: nome, email: email, mensagem: mensagem }]);

    if (error) {
      alert('Erro ao enviar mensagem: ' + error.message);
    } else {
      alert('Mensagem enviada com sucesso!');
      document.getElementById('meuFormulario').reset(); // Limpa os campos
    }
  });
</script>
